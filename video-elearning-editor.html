<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画教材エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#12201A;
    --bg-1:#1B2F26;
    --bg-2:#24392F;
    --bg-3:#2C453A;
    --line:#3C554A;
    --chalk:#F4F1E6;
    --chalk-dim:#B9C4BC;
    --accent:#E8B94A;
    --accent-dim:#8A6E2E;
    --mint:#7FD8A3;
    --danger:#E2725B;
    --font-d:'Zen Kaku Gothic New',sans-serif;
    --font-b:'Zen Kaku Gothic New',sans-serif;
    --font-m:'JetBrains Mono',monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--chalk);
    font-family:var(--font-b);
    min-height:100vh;
  }
  button{
    font-family:var(--font-d);
    cursor:pointer;
  }
  input,select{
    font-family:var(--font-b);
  }

  /* ---------- header ---------- */
  header{
    padding:20px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-right:auto;
  }
  .brand h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
  }
  .brand .eyebrow{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--accent);
    letter-spacing:.12em;
  }
  #courseTitle{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:var(--radius);
    padding:8px 12px;
    font-size:14px;
    width:220px;
  }
  #courseTitle:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .tabbar{
    display:flex;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:3px;
  }
  .tabbar button{
    border:none;
    background:transparent;
    color:var(--chalk-dim);
    padding:8px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    transition:background .15s, color .15s;
  }
  .tabbar button.active{
    background:var(--accent);
    color:#2A2005;
  }

  .btn{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:500;
  }
  .btn:hover{border-color:var(--accent-dim);}
  .btn.primary{
    background:var(--accent);
    color:#2A2005;
    border-color:var(--accent);
  }
  .btn.primary:hover{background:#f0c667;}
  .btn.ghost{background:transparent;border-color:var(--line);}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}
  #saveStatus{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--mint);
    min-width:70px;
  }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:20px;
    padding:20px 28px;
  }
  body.mode-preview .layout{
    grid-template-columns:1fr;
    max-width:920px;
    margin:0 auto;
  }
  body.mode-preview .side-panel,
  body.mode-preview .timeline-wrap{display:none;}

  .stage-col{display:flex;flex-direction:column;gap:16px;}

  .video-stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#0A140F;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video-stage video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  .empty-stage{
    text-align:center;
    color:var(--chalk-dim);
    font-size:14px;
    padding:20px;
  }
  .empty-stage .btn{margin-top:14px;}

  .overlay-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .overlay-item{
    position:absolute;
    transform:translate(-50%,-50%);
    padding:4px 10px;
    white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.9);
    font-weight:700;
    pointer-events:none;
    user-select:none;
  }
  body.mode-edit .overlay-item{
    pointer-events:auto;
    cursor:grab;
    border:1px dashed transparent;
  }
  body.mode-edit .overlay-item:hover{border-color:var(--accent);}
  body.mode-edit .overlay-item.dragging{cursor:grabbing;border-color:var(--accent);}

  .video-note{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--chalk-dim);
  }

  /* ---------- timeline ---------- */
  .timeline-wrap{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px 10px;
  }
  .timeline-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .timeline-head .btn{padding:6px 12px;font-size:12px;}
  .timecode{font-family:var(--font-m);font-size:12px;color:var(--chalk-dim);}
  .sprockets{
    height:8px;
    background-color:var(--bg-2);
    background-image:radial-gradient(circle,var(--bg-0) 2.6px,transparent 3px);
    background-size:14px 100%;
    background-position:4px center;
    border-radius:2px;
  }
  .timeline-track{
    position:relative;
    height:52px;
    background:var(--bg-2);
    margin:2px 0;
    cursor:pointer;
    overflow:hidden;
  }
  .timeline-bar{
    position:absolute;
    top:8px;
    height:36px;
    background:var(--bg-3);
    border:1px solid var(--accent-dim);
    border-radius:4px;
    font-size:11px;
    color:var(--accent);
    display:flex;
    align-items:center;
    padding:0 6px;
    overflow:hidden;
    white-space:nowrap;
    pointer-events:none;
  }
  .playhead{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:var(--accent);
    pointer-events:none;
  }

  /* ---------- side panel ---------- */
  .side-panel{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 130px);
    overflow:hidden;
  }
  .side-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .side-tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    padding:12px;
    font-size:13px;
    font-weight:500;
    border-bottom:2px solid transparent;
  }
  .side-tabs button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .side-body{
    padding:14px;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .empty-hint{
    color:var(--chalk-dim);
    font-size:13px;
    text-align:center;
    padding:24px 8px;
    line-height:1.7;
  }

  .card{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card-row{display:flex;gap:8px;align-items:center;}
  .card textarea, .card input[type=text]{
    width:100%;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    resize:none;
  }
  .field-label{
    font-size:11px;
    color:var(--chalk-dim);
    font-family:var(--font-m);
    min-width:34px;
  }
  .card input[type=number]{
    width:64px;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:6px;
    padding:5px 6px;
    font-family:var(--font-m);
    font-size:12px;
  }
  .card input[type=color]{
    width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;
  }
  .card input[type=range]{flex:1;accent-color:var(--accent);}
  .card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .small-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    font-size:11px;
    padding:5px 9px;
    border-radius:6px;
  }
  .small-btn:hover{color:var(--chalk);border-color:var(--accent-dim);}
  .small-btn.del{color:var(--danger);border-color:transparent;}
  .small-btn.del:hover{border-color:var(--danger);}

  .quiz-choice{display:flex;align-items:center;gap:8px;}
  .quiz-choice input[type=text]{flex:1;}
  .quiz-choice input[type=radio]{accent-color:var(--mint);}

  .add-btn{
    border:1px dashed var(--line);
    background:transparent;
    color:var(--chalk-dim);
    padding:10px;
    border-radius:var(--radius);
    font-size:13px;
  }
  .add-btn:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- quiz overlay (viewer mode) ---------- */
  .quiz-overlay{
    position:absolute;
    inset:0;
    background:rgba(18,32,26,.97);
    display:none;
    flex-direction:column;
    padding:26px;
    overflow-y:auto;
  }
  .quiz-overlay.show{display:flex;}
  .quiz-overlay h2{
    font-size:18px;
    margin:0 0 4px;
  }
  .quiz-overlay .sub{
    color:var(--chalk-dim);
    font-size:13px;
    margin-bottom:16px;
  }
  .qv-question{
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .qv-question p.qtext{font-size:14px;font-weight:500;margin:0 0 10px;}
  .qv-opt{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:4px;
    border:1px solid transparent;
  }
  .qv-opt:hover{background:var(--bg-2);}
  .qv-opt.correct{border-color:var(--mint);color:var(--mint);}
  .qv-opt.incorrect{border-color:var(--danger);color:var(--danger);}
  .qv-actions{margin-top:10px;display:flex;gap:10px;align-items:center;}
  .score-line{font-family:var(--font-m);font-size:14px;color:var(--accent);margin-top:6px;}
  .complete-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:14px;text-align:center;color:var(--chalk-dim);
  }
</style>
</head>
<body class="mode-edit">

<header>
  <div class="brand">
    <span class="eyebrow">VIDEO LESSON BUILDER</span>
    <h1>動画教材エディタ</h1>
  </div>
  <input id="courseTitle" type="text" placeholder="コース名を入力">
  <div class="tabbar">
    <button id="tabEdit" class="active">編集</button>
    <button id="tabPreview">プレビュー(受講)</button>
  </div>
  <button class="btn ghost" id="loadBtn">読み込む</button>
  <button class="btn primary" id="saveBtn">保存</button>
  <span id="saveStatus"></span>
</header>

<div class="layout">
  <div class="stage-col">
    <div class="video-stage" id="videoStage">
      <div class="empty-stage" id="emptyStage">
        動画がまだ選択されていません<br>
        <button class="btn primary" id="pickVideoBtn">動画を選択</button>
        <input type="file" id="videoInput" accept="video/*" style="display:none">
      </div>
      <video id="mainVideo" controls style="display:none"></video>
      <div class="overlay-layer" id="overlayLayer"></div>
      <div class="quiz-overlay" id="quizOverlay"></div>
    </div>
    <div class="video-note">※ 動画ファイル自体は保存されません。読み込み時は同じ動画を選択し直してください。</div>

    <div class="timeline-wrap">
      <div class="timeline-head">
        <span class="timecode" id="timecodeLabel">00:00 / 00:00</span>
        <button class="btn" id="addOverlayBtn">＋ このタイミングにテキストを追加</button>
      </div>
      <div class="sprockets"></div>
      <div class="timeline-track" id="timelineTrack">
        <div class="playhead" id="playhead" style="left:0%"></div>
      </div>
      <div class="sprockets"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="side-tabs">
      <button id="sideTabOverlay" class="active">テキスト</button>
      <button id="sideTabQuiz">クイズ</button>
    </div>
    <div class="side-body" id="sideBody"></div>
  </div>
</div>

<script>
const state = {
  title:'',
  overlays:[],
  quiz:[],
  videoName:''
};
let sideTab = 'overlay';
let mode = 'edit';
let dragId = null;

const $ = s => document.querySelector(s);
const video = $('#mainVideo');
const videoStage = $('#videoStage');
const overlayLayer = $('#overlayLayer');
const quizOverlay = $('#quizOverlay');
const timelineTrack = $('#timelineTrack');
const playhead = $('#playhead');
const emptyStage = $('#emptyStage');

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(t){
  if(!isFinite(t)) t = 0;
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ---------- video load ---------- */
$('#pickVideoBtn').addEventListener('click', ()=> $('#videoInput').click());
$('#videoInput').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  state.videoName = f.name;
  video.src = url;
  video.style.display = 'block';
  emptyStage.style.display = 'none';
});

video.addEventListener('loadedmetadata', ()=>{ updateTimecode(); renderOverlayBars(); });
video.addEventListener('timeupdate', ()=>{ updateTimecode(); updateActiveOverlays(); });
video.addEventListener('ended', ()=>{ if(mode==='preview') showQuiz(); });

function updateTimecode(){
  const d = video.duration || 0;
  $('#timecodeLabel').textContent = fmt(video.currentTime)+' / '+fmt(d);
  playhead.style.left = (d? (video.currentTime/d*100):0)+'%';
}

/* ---------- timeline ---------- */
timelineTrack.addEventListener('click', e=>{
  if(!video.duration) return;
  const rect = timelineTrack.getBoundingClientRect();
  const ratio = (e.clientX-rect.left)/rect.width;
  video.currentTime = ratio*video.duration;
});

$('#addOverlayBtn').addEventListener('click', ()=>{
  if(!video.duration){ alert('先に動画を選択してください'); return; }
  const start = video.currentTime;
  const end = Math.min(start+3, video.duration);
  state.overlays.push({id:uid(), text:'テキストを入力', start, end, x:50, y:82, color:'#F4F1E6', size:28});
  renderSide(); renderOverlayBars(); updateActiveOverlays();
});

function renderOverlayBars(){
  timelineTrack.querySelectorAll('.timeline-bar').forEach(b=>b.remove());
  const d = video.duration || 0;
  if(!d) return;
  state.overlays.forEach(o=>{
    const bar = document.createElement('div');
    bar.className = 'timeline-bar';
    bar.style.left = (o.start/d*100)+'%';
    bar.style.width = Math.max(((o.end-o.start)/d*100),1.5)+'%';
    bar.textContent = o.text;
    timelineTrack.appendChild(bar);
  });
}

/* ---------- overlay rendering on video ---------- */
function updateActiveOverlays(){
  overlayLayer.innerHTML = '';
  const t = video.currentTime;
  state.overlays.forEach(o=>{
    const active = mode==='edit' ? true : (t>=o.start && t<=o.end);
    if(mode==='edit'){
      // in edit mode show only overlays whose range includes current time, so editing is contextual
      if(!(t>=o.start && t<=o.end)) return;
    } else {
      if(!(t>=o.start && t<=o.end)) return;
    }
    const el = document.createElement('div');
    el.className = 'overlay-item';
    el.textContent = o.text;
    el.style.left = o.x+'%';
    el.style.top = o.y+'%';
    el.style.color = o.color;
    el.style.fontSize = o.size+'px';
    el.dataset.id = o.id;
    if(mode==='edit'){
      el.addEventListener('pointerdown', startDrag);
    }
    overlayLayer.appendChild(el);
  });
}

function startDrag(e){
  const el = e.currentTarget;
  dragId = el.dataset.id;
  el.classList.add('dragging');
  const move = ev=>{
    const rect = videoStage.getBoundingClientRect();
    let x = ((ev.clientX-rect.left)/rect.width)*100;
    let y = ((ev.clientY-rect.top)/rect.height)*100;
    x = Math.max(2,Math.min(98,x));
    y = Math.max(4,Math.min(96,y));
    el.style.left = x+'%';
    el.style.top = y+'%';
    const o = state.overlays.find(o=>o.id===dragId);
    if(o){ o.x = x; o.y = y; }
  };
  const up = ()=>{
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

/* ---------- side panel: overlay tab ---------- */
function renderSide(){
  const body = $('#sideBody');
  body.innerHTML = '';
  if(sideTab==='overlay'){
    if(state.overlays.length===0){
      body.innerHTML = '<div class="empty-hint">タイムライン上の「＋」ボタンから、<br>動画に重ねるテキストを追加できます。</div>';
    }
    state.overlays.forEach(o=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <textarea rows="2">${o.text}</textarea>
        <div class="card-row">
          <span class="field-label">IN</span>
          <input type="number" step="0.1" min="0" value="${o.start.toFixed(1)}" class="inStart">
          <span class="field-label">OUT</span>
          <input type="number" step="0.1" min="0" value="${o.end.toFixed(1)}" class="inEnd">
        </div>
        <div class="card-row">
          <span class="field-label">色</span>
          <input type="color" value="${o.color}" class="inColor">
          <span class="field-label">大きさ</span>
          <input type="range" min="14" max="56" value="${o.size}" class="inSize">
        </div>
        <div class="card-actions">
          <button class="small-btn seekBtn">この位置へ移動</button>
          <button class="small-btn del delBtn">削除</button>
        </div>`;
      card.querySelector('textarea').addEventListener('input', e=>{ o.text=e.target.value; renderOverlayBars(); updateActiveOverlays(); });
      card.querySelector('.inStart').addEventListener('change', e=>{ o.start=Math.max(0,parseFloat(e.target.value)||0); renderOverlayBars(); });
      card.querySelector('.inEnd').addEventListener('change', e=>{ o.end=Math.max(o.start+0.2,parseFloat(e.target.value)||o.start+1); renderOverlayBars(); });
      card.querySelector('.inColor').addEventListener('input', e=>{ o.color=e.target.value; updateActiveOverlays(); });
      card.querySelector('.inSize').addEventListener('input', e=>{ o.size=parseInt(e.target.value); updateActiveOverlays(); });
      card.querySelector('.seekBtn').addEventListener('click', ()=>{ video.currentTime=o.start; });
      card.querySelector('.delBtn').addEventListener('click', ()=>{ state.overlays=state.overlays.filter(x=>x.id!==o.id); renderSide(); renderOverlayBars(); updateActiveOverlays(); });
      body.appendChild(card);
    });
    const addBtn = document.createElement('button');
    addBtn.className='add-btn';
    addBtn.textContent='＋ 現在の再生位置にテキストを追加';
    addBtn.addEventListener('click', ()=> $('#addOverlayBtn').click());
    body.appendChild(addBtn);
  } else {
    if(state.quiz.length===0){
      body.innerHTML = '<div class="empty-hint">動画を見終えたあとに出題する<br>クイズを作成できます。</div>';
    }
    state.quiz.forEach(q=>{
      const card = document.createElement('div');
      card.className = 'card';
      let choicesHtml = q.choices.map((c,i)=>`
        <div class="quiz-choice">
          <input type="radio" name="correct-${q.id}" ${q.correct===i?'checked':''} class="correctRadio" data-i="${i}">
          <input type="text" value="${c}" class="choiceInput" data-i="${i}" placeholder="選択肢 ${i+1}">
        </div>`).join('');
      card.innerHTML = `
        <textarea rows="2" placeholder="問題文を入力" class="qText">${q.question}</textarea>
        ${choicesHtml}
        <div class="card-actions">
          <span class="field-label" style="min-width:auto">正解にチェック</span>
          <button class="small-btn del delQBtn">削除</button>
        </div>`;
      card.querySelector('.qText').addEventListener('input', e=>{ q.question=e.target.value; });
      card.querySelectorAll('.choiceInput').forEach(inp=>{
        inp.addEventListener('input', e=>{ q.choices[+e.target.dataset.i]=e.target.value; });
      });
      card.querySelectorAll('.correctRadio').forEach(r=>{
        r.addEventListener('change', e=>{ q.correct=+e.target.dataset.i; });
      });
      card.querySelector('.delQBtn').addEventListener('click', ()=>{ state.quiz=state.quiz.filter(x=>x.id!==q.id); renderSide(); });
      body.appendChild(card);
    });
    const addBtn = document.createElement('button');
    addBtn.className='add-btn';
    addBtn.textContent='＋ 問題を追加';
    addBtn.addEventListener('click', ()=>{
      state.quiz.push({id:uid(), question:'', choices:['','','',''], correct:0});
      renderSide();
    });
    body.appendChild(addBtn);
  }
}

$('#sideTabOverlay').addEventListener('click', ()=>{ sideTab='overlay'; $('#sideTabOverlay').classList.add('active'); $('#sideTabQuiz').classList.remove('active'); renderSide(); });
$('#sideTabQuiz').addEventListener('click', ()=>{ sideTab='quiz'; $('#sideTabQuiz').classList.add('active'); $('#sideTabOverlay').classList.remove('active'); renderSide(); });

/* ---------- mode tabs ---------- */
$('#tabEdit').addEventListener('click', ()=> setMode('edit'));
$('#tabPreview').addEventListener('click', ()=>{
  if(!video.src){ alert('先に動画を選択してください'); return; }
  setMode('preview');
});

function setMode(m){
  mode = m;
  document.body.className = 'mode-'+m;
  $('#tabEdit').classList.toggle('active', m==='edit');
  $('#tabPreview').classList.toggle('active', m==='preview');
  quizOverlay.classList.remove('show');
  quizOverlay.innerHTML='';
  if(m==='preview'){ video.currentTime = 0; }
  updateActiveOverlays();
}

/* ---------- quiz viewer ---------- */
function showQuiz(){
  if(state.quiz.length===0){
    quizOverlay.innerHTML = `<div class="complete-box"><h2 style="color:var(--chalk)">視聴が完了しました</h2><p>この教材にはクイズが設定されていません。</p></div>`;
    quizOverlay.classList.add('show');
    return;
  }
  let html = `<h2>視聴おつかれさまでした</h2><p class="sub">内容を振り返るクイズです。すべて回答して「採点する」を押してください。</p>`;
  state.quiz.forEach((q,qi)=>{
    html += `<div class="qv-question" data-qid="${q.id}">
      <p class="qtext">Q${qi+1}. ${q.question || '(問題文未設定)'}</p>
      ${q.choices.map((c,i)=>`
        <label class="qv-opt" data-i="${i}">
          <input type="radio" name="ans-${q.id}" value="${i}"> ${c || '(選択肢未設定)'}
        </label>`).join('')}
    </div>`;
  });
  html += `<div class="qv-actions">
    <button class="btn primary" id="gradeBtn">採点する</button>
    <button class="btn ghost" id="retryBtn">もう一度視聴する</button>
    <span class="score-line" id="scoreLine"></span>
  </div>`;
  quizOverlay.innerHTML = html;
  quizOverlay.classList.add('show');

  quizOverlay.querySelector('#gradeBtn').addEventListener('click', ()=>{
    let correctCount = 0;
    state.quiz.forEach(q=>{
      const block = quizOverlay.querySelector(`.qv-question[data-qid="${q.id}"]`);
      const checked = block.querySelector('input[type=radio]:checked');
      const chosen = checked ? +checked.value : -1;
      if(chosen===q.correct) correctCount++;
      block.querySelectorAll('.qv-opt').forEach((opt,i)=>{
        opt.classList.remove('correct','incorrect');
        if(i===q.correct) opt.classList.add('correct');
        else if(i===chosen) opt.classList.add('incorrect');
      });
    });
    quizOverlay.querySelector('#scoreLine').textContent = `結果: ${correctCount} / ${state.quiz.length} 問正解`;
  });
  quizOverlay.querySelector('#retryBtn').addEventListener('click', ()=>{
    quizOverlay.classList.remove('show');
    quizOverlay.innerHTML='';
    video.currentTime = 0;
  });
}

/* ---------- save / load ---------- */
$('#saveBtn').addEventListener('click', async ()=>{
  state.title = $('#courseTitle').value.trim();
  if(!state.title){ alert('コース名を入力してください'); return; }
  const key = 'elearning-course:' + state.title.toLowerCase().replace(/\s+/g,'-').slice(0,60);
  const payload = { title: state.title, overlays: state.overlays, quiz: state.quiz, videoName: state.videoName, savedAt: Date.now() };
  try{
    const res = await window.storage.set(key, JSON.stringify(payload), false);
    $('#saveStatus').textContent = res ? '保存しました' : '保存に失敗しました';
    setTimeout(()=> $('#saveStatus').textContent='', 2500);
  }catch(err){
    $('#saveStatus').textContent = '保存エラー';
    setTimeout(()=> $('#saveStatus').textContent='', 2500);
  }
});

$('#loadBtn').addEventListener('click', async ()=>{
  let list;
  try{
    list = await window.storage.list('elearning-course:', false);
  }catch(err){ alert('一覧の取得に失敗しました'); return; }
  if(!list || !list.keys || list.keys.length===0){ alert('保存されたコースがありません'); return; }

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;';
  modal.innerHTML = `<div style="background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:18px;width:340px;max-height:70vh;overflow-y:auto;">
    <h3 style="margin:0 0 12px;font-size:15px;">保存済みコース</h3>
    <div id="courseList" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button class="btn ghost" id="closeModal" style="margin-top:14px;width:100%;">閉じる</button>
  </div>`;
  document.body.appendChild(modal);
  const listEl = modal.querySelector('#courseList');

  for(const key of list.keys){
    try{
      const res = await window.storage.get(key, false);
      const data = JSON.parse(res.value);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;';
      row.innerHTML = `<button class="btn" style="flex:1;text-align:left;">${data.title}</button><button class="small-btn del">削除</button>`;
      row.querySelector('button.btn').addEventListener('click', ()=>{
        state.overlays = data.overlays || [];
        state.quiz = data.quiz || [];
        state.title = data.title || '';
        state.videoName = data.videoName || '';
        $('#courseTitle').value = state.title;
        renderSide(); renderOverlayBars(); updateActiveOverlays();
        if(state.videoName){ alert('動画「'+state.videoName+'」を選択し直してください。'); }
        modal.remove();
      });
      row.querySelector('.del').addEventListener('click', async ()=>{
        try{
          await window.storage.delete(key, false);
          row.remove();
        }catch(e){}
      });
      listEl.appendChild(row);
    }catch(e){}
  }
  modal.querySelector('#closeModal').addEventListener('click', ()=> modal.remove());
});

renderSide();
</script>
</body>
</html>
