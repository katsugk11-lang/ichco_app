<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画教材エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#12201A;
    --bg-1:#1B2F26;
    --bg-2:#24392F;
    --bg-3:#2C453A;
    --line:#3C554A;
    --chalk:#F4F1E6;
    --chalk-dim:#B9C4BC;
    --accent:#E8B94A;
    --accent-dim:#8A6E2E;
    --mint:#7FD8A3;
    --danger:#E2725B;
    --font-d:'Zen Kaku Gothic New',sans-serif;
    --font-b:'Zen Kaku Gothic New',sans-serif;
    --font-m:'JetBrains Mono',monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--chalk);
    font-family:var(--font-b);
    min-height:100vh;
  }
  button{
    font-family:var(--font-d);
    cursor:pointer;
  }
  input,select{
    font-family:var(--font-b);
  }

  /* ---------- header ---------- */
  header{
    padding:20px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-right:auto;
  }
  .brand h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
  }
  .brand .eyebrow{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--accent);
    letter-spacing:.12em;
  }
  #courseTitle{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:var(--radius);
    padding:8px 12px;
    font-size:14px;
    width:220px;
  }
  #courseTitle:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .tabbar{
    display:flex;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:3px;
  }
  .tabbar button{
    border:none;
    background:transparent;
    color:var(--chalk-dim);
    padding:8px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    transition:background .15s, color .15s;
  }
  .tabbar button.active{
    background:var(--accent);
    color:#2A2005;
  }

  .btn{
    background:var(--bg-2);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:9px 16px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:500;
  }
  .btn:hover{border-color:var(--accent-dim);}
  .btn.primary{
    background:var(--accent);
    color:#2A2005;
    border-color:var(--accent);
  }
  .btn.primary:hover{background:#f0c667;}
  .btn.ghost{background:transparent;border-color:var(--line);}
  .btn.danger-outline{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  #saveStatus{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--mint);
    min-width:70px;
  }
  #saveStatus.error{color:var(--danger);}

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:20px;
    padding:20px 28px;
  }
  body.mode-preview .layout{
    grid-template-columns:1fr;
    max-width:920px;
    margin:0 auto;
  }
  body.mode-preview .side-panel,
  body.mode-preview .clip-panel{display:none;}

  .stage-col{display:flex;flex-direction:column;gap:16px;}

  .video-stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#0A140F;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video-stage video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  .empty-stage{
    text-align:center;
    color:var(--chalk-dim);
    font-size:14px;
    padding:20px;
  }
  .empty-stage .btn{margin-top:14px;}

  .overlay-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .overlay-item{
    position:absolute;
    transform:translate(-50%,-50%);
    padding:4px 10px;
    white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.7), 0 0 2px rgba(0,0,0,.9);
    font-weight:700;
    pointer-events:none;
    user-select:none;
  }
  body.mode-edit .overlay-item{
    pointer-events:auto;
    cursor:grab;
    border:1px dashed transparent;
  }
  body.mode-edit .overlay-item:hover{border-color:var(--accent);}
  body.mode-edit .overlay-item.dragging{cursor:grabbing;border-color:var(--accent);}
  .overlay-item.pausing{
    box-shadow:0 0 0 1px var(--accent);
    border-radius:6px;
  }

  .pause-badge{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(18,32,26,.88);
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:var(--font-m);
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    display:none;
    align-items:center;
    gap:8px;
  }
  .pause-badge.show{display:flex;}
  .pause-badge button{
    background:transparent;
    border:1px solid var(--accent-dim);
    color:var(--chalk);
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
  }

  .clip-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:rgba(18,32,26,.75);
    color:var(--chalk-dim);
    font-family:var(--font-m);
    font-size:11px;
    padding:4px 9px;
    border-radius:8px;
    pointer-events:none;
  }

  .video-note{
    font-family:var(--font-m);
    font-size:11px;
    color:var(--chalk-dim);
  }

  /* ---------- clip panel ---------- */
  .clip-panel{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .clip-panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .clip-panel-head h3{font-size:13px;margin:0;color:var(--chalk-dim);font-weight:500;}
  .clip-list{display:flex;flex-direction:column;gap:6px;}
  .clip-row{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 9px;
    font-size:12px;
  }
  .clip-row.current{border-color:var(--accent);}
  .clip-row .clip-idx{
    font-family:var(--font-m);
    color:var(--accent);
    min-width:18px;
  }
  .clip-row .clip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .clip-row .clip-dur{font-family:var(--font-m);color:var(--chalk-dim);font-size:11px;}
  .clip-row button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    font-size:11px;
    padding:3px 7px;
    border-radius:5px;
  }
  .clip-row button:hover{color:var(--chalk);border-color:var(--accent-dim);}
  .clip-row button.del:hover{color:var(--danger);border-color:var(--danger);}
  .clip-empty-hint{color:var(--chalk-dim);font-size:12px;line-height:1.6;padding:6px 2px 2px;}

  /* ---------- timeline ---------- */
  .timeline-wrap{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px 10px;
  }
  .timeline-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    flex-wrap:wrap;
    gap:6px;
  }
  .timeline-head .btn{padding:6px 12px;font-size:12px;}
  .timecode{font-family:var(--font-m);font-size:12px;color:var(--chalk-dim);}
  .sprockets{
    height:8px;
    background-color:var(--bg-2);
    background-image:radial-gradient(circle,var(--bg-0) 2.6px,transparent 3px);
    background-size:14px 100%;
    background-position:4px center;
    border-radius:2px;
  }
  .timeline-track{
    position:relative;
    height:52px;
    background:var(--bg-2);
    margin:2px 0;
    cursor:pointer;
    overflow:hidden;
  }
  .timeline-bar{
    position:absolute;
    top:8px;
    height:22px;
    background:var(--bg-3);
    border:1px solid var(--accent-dim);
    border-radius:4px;
    font-size:11px;
    color:var(--accent);
    display:flex;
    align-items:center;
    padding:0 6px;
    overflow:hidden;
    white-space:nowrap;
    pointer-events:none;
  }
  .timeline-bar.has-pause{border-color:var(--mint);color:var(--mint);}
  .clip-divider{
    position:absolute;
    top:0;
    bottom:0;
    width:1px;
    background:var(--line);
    pointer-events:none;
  }
  .clip-tag{
    position:absolute;
    bottom:2px;
    font-family:var(--font-m);
    font-size:9px;
    color:var(--chalk-dim);
    pointer-events:none;
  }
  .playhead{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:var(--accent);
    pointer-events:none;
  }

  /* ---------- side panel ---------- */
  .side-panel{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 130px);
    overflow:hidden;
  }
  .side-tabs{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .side-tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    padding:12px;
    font-size:13px;
    font-weight:500;
    border-bottom:2px solid transparent;
  }
  .side-tabs button.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }
  .side-body{
    padding:14px;
    overflow-y:auto;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .empty-hint{
    color:var(--chalk-dim);
    font-size:13px;
    text-align:center;
    padding:24px 8px;
    line-height:1.7;
  }

  .card{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card-row{display:flex;gap:8px;align-items:center;}
  .card textarea, .card input[type=text]{
    width:100%;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:6px;
    padding:6px 8px;
    font-size:13px;
    resize:none;
  }
  .field-label{
    font-size:11px;
    color:var(--chalk-dim);
    font-family:var(--font-m);
    min-width:34px;
  }
  .card input[type=number]{
    width:64px;
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:6px;
    padding:5px 6px;
    font-family:var(--font-m);
    font-size:12px;
  }
  .card input[type=color]{
    width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;
  }
  .card input[type=range]{flex:1;accent-color:var(--accent);}
  .card select{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--chalk);
    border-radius:6px;
    padding:5px 6px;
    font-size:12px;
  }
  .card-actions{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
  .small-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
    font-size:11px;
    padding:5px 9px;
    border-radius:6px;
  }
  .small-btn:hover{color:var(--chalk);border-color:var(--accent-dim);}
  .small-btn.del{color:var(--danger);border-color:transparent;}
  .small-btn.del:hover{border-color:var(--danger);}
  .pause-hint{font-size:11px;color:var(--mint);font-family:var(--font-m);}

  .quiz-choice{display:flex;align-items:center;gap:8px;}
  .quiz-choice input[type=text]{flex:1;}
  .quiz-choice input[type=radio]{accent-color:var(--mint);}

  .add-btn{
    border:1px dashed var(--line);
    background:transparent;
    color:var(--chalk-dim);
    padding:10px;
    border-radius:var(--radius);
    font-size:13px;
  }
  .add-btn:hover{color:var(--accent);border-color:var(--accent);}

  /* ---------- quiz overlay (viewer mode) ---------- */
  .quiz-overlay{
    position:absolute;
    inset:0;
    background:rgba(18,32,26,.97);
    display:none;
    flex-direction:column;
    padding:26px;
    overflow-y:auto;
  }
  .quiz-overlay.show{display:flex;}
  .quiz-overlay h2{
    font-size:18px;
    margin:0 0 4px;
  }
  .quiz-overlay .sub{
    color:var(--chalk-dim);
    font-size:13px;
    margin-bottom:16px;
  }
  .qv-question{
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .qv-question p.qtext{font-size:14px;font-weight:500;margin:0 0 10px;}
  .qv-opt{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:4px;
    border:1px solid transparent;
  }
  .qv-opt:hover{background:var(--bg-2);}
  .qv-opt.correct{border-color:var(--mint);color:var(--mint);}
  .qv-opt.incorrect{border-color:var(--danger);color:var(--danger);}
  .qv-actions{margin-top:10px;display:flex;gap:10px;align-items:center;}
  .score-line{font-family:var(--font-m);font-size:14px;color:var(--accent);margin-top:6px;}
  .complete-box{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:14px;text-align:center;color:var(--chalk-dim);
  }
</style>
</head>
<body class="mode-edit">

<header>
  <div class="brand">
    <span class="eyebrow">VIDEO LESSON BUILDER</span>
    <h1>動画教材エディタ</h1>
  </div>
  <input id="courseTitle" type="text" placeholder="コース名を入力">
  <div class="tabbar">
    <button id="tabEdit" class="active">編集</button>
    <button id="tabPreview">プレビュー(受講)</button>
  </div>
  <button class="btn ghost" id="loadBtn">読み込む</button>
  <button class="btn primary" id="saveBtn">保存</button>
  <span id="saveStatus"></span>
</header>

<div class="layout">
  <div class="stage-col">
    <div class="video-stage" id="videoStage">
      <div class="empty-stage" id="emptyStage">
        動画がまだ選択されていません<br>
        <button class="btn primary" id="pickVideoBtn">動画を選択（複数可）</button>
        <input type="file" id="videoInput" accept="video/*" multiple style="display:none">
      </div>
      <video id="mainVideo" controls style="display:none"></video>
      <div class="clip-badge" id="clipBadge" style="display:none"></div>
      <div class="overlay-layer" id="overlayLayer"></div>
      <div class="pause-badge" id="pauseBadge">
        <span id="pauseBadgeText">一時停止中…</span>
        <button id="pauseSkipBtn">スキップ</button>
      </div>
      <div class="quiz-overlay" id="quizOverlay"></div>
    </div>
    <div class="video-note">※ 動画ファイル自体は保存されません。読み込み時は同じ動画を、同じ順番で選択し直してください。</div>

    <div class="clip-panel" id="clipPanel">
      <div class="clip-panel-head">
        <h3>動画クリップ（連結順）</h3>
        <button class="small-btn" id="addClipBtn">＋ 動画を追加</button>
      </div>
      <div class="clip-list" id="clipList"></div>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-head">
        <span class="timecode" id="timecodeLabel">00:00 / 00:00</span>
        <button class="btn" id="addOverlayBtn">＋ このタイミングにテキストを追加</button>
      </div>
      <div class="sprockets"></div>
      <div class="timeline-track" id="timelineTrack">
        <div class="playhead" id="playhead" style="left:0%"></div>
      </div>
      <div class="sprockets"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="side-tabs">
      <button id="sideTabOverlay" class="active">テキスト</button>
      <button id="sideTabQuiz">クイズ</button>
    </div>
    <div class="side-body" id="sideBody"></div>
  </div>
</div>

<script>
const state = {
  courseId:'',
  title:'',
  clips:[],           // {id, name, duration, url}
  overlays:[],        // {id, clipId, text, start, end, x, y, color, size, pause}
  quiz:[],
};
let sideTab = 'overlay';
let mode = 'edit';
let dragId = null;
let currentClipIndex = 0;
let pendingPauseTimer = null;
let activePauseOverlayId = null;

const $ = s => document.querySelector(s);
const video = $('#mainVideo');
const videoStage = $('#videoStage');
const overlayLayer = $('#overlayLayer');
const quizOverlay = $('#quizOverlay');
const timelineTrack = $('#timelineTrack');
const playhead = $('#playhead');
const emptyStage = $('#emptyStage');
const clipBadge = $('#clipBadge');
const pauseBadge = $('#pauseBadge');
const pauseBadgeText = $('#pauseBadgeText');

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(t){
  if(!isFinite(t)) t = 0;
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function currentClip(){ return state.clips[currentClipIndex] || null; }
function totalDuration(){ return state.clips.reduce((a,c)=>a+(c.duration||0),0); }
function clipOffset(index){
  let off = 0;
  for(let i=0;i<index;i++) off += (state.clips[i].duration||0);
  return off;
}
function overlaysForCurrentClip(){
  const c = currentClip();
  if(!c) return [];
  return state.overlays.filter(o=>o.clipId===c.id);
}

/* ---------- clip management ---------- */
$('#pickVideoBtn').addEventListener('click', ()=> $('#videoInput').click());
$('#addClipBtn').addEventListener('click', ()=> $('#videoInput').click());

$('#videoInput').addEventListener('change', async e=>{
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  const needsFirstLoad = !video.src || video.style.display==='none';
  // if a course was loaded from storage, its clips exist as placeholders (no url yet) —
  // fill those in order first, matching the original filenames/order, before appending new ones
  const placeholders = state.clips.filter(c=>!c.url);
  let fi = 0;
  for(const ph of placeholders){
    if(fi>=files.length) break;
    const f = files[fi++];
    const dur = await probeDuration(f).catch(()=> ph.duration||0);
    ph.url = URL.createObjectURL(f);
    ph.name = f.name;
    if(dur) ph.duration = dur;
  }
  for(; fi<files.length; fi++){
    const f = files[fi];
    const dur = await probeDuration(f).catch(()=>0);
    state.clips.push({ id: uid(), name: f.name, duration: dur, url: URL.createObjectURL(f) });
  }
  e.target.value = '';
  emptyStage.style.display = 'none';
  video.style.display = 'block';
  renderClipList();
  renderOverlayBars();
  if(needsFirstLoad && state.clips.length>0 && state.clips[0].url){
    loadClip(0, 0, false);
  }
});

function probeDuration(file){
  return new Promise((resolve,reject)=>{
    const tmp = document.createElement('video');
    tmp.preload = 'metadata';
    tmp.src = URL.createObjectURL(file);
    tmp.onloadedmetadata = ()=>{
      const d = tmp.duration;
      URL.revokeObjectURL(tmp.src);
      resolve(isFinite(d) ? d : 0);
    };
    tmp.onerror = ()=> reject(new Error('動画の読み込みに失敗しました'));
  });
}

function loadClip(index, seekTo, autoplay){
  if(index<0 || index>=state.clips.length) return;
  const c = state.clips[index];
  if(!c.url){ alert('この動画クリップはまだ読み込まれていません。「動画を追加」から選び直してください。'); return; }
  currentClipIndex = index;
  const onReady = ()=>{
    video.currentTime = seekTo || 0;
    if(autoplay) video.play().catch(()=>{});
    video.removeEventListener('loadedmetadata', onReady);
    updateClipBadge();
    updateOverlayContext();
  };
  video.addEventListener('loadedmetadata', onReady);
  video.src = c.url;
  video.load();
}

function updateClipBadge(){
  if(state.clips.length<=1){ clipBadge.style.display='none'; return; }
  const c = currentClip();
  if(!c){ clipBadge.style.display='none'; return; }
  clipBadge.style.display = 'block';
  clipBadge.textContent = (currentClipIndex+1)+' / '+state.clips.length+'　'+c.name;
}

function renderClipList(){
  const list = $('#clipList');
  list.innerHTML = '';
  if(state.clips.length===0){
    list.innerHTML = '<div class="clip-empty-hint">動画を追加すると、ここに再生順のリストが表示されます。複数選択すると自動的に連結されます。</div>';
    return;
  }
  state.clips.forEach((c,i)=>{
    const row = document.createElement('div');
    row.className = 'clip-row' + (i===currentClipIndex ? ' current' : '');
    row.innerHTML = `
      <span class="clip-idx">${i+1}</span>
      <span class="clip-name" title="${c.name}">${c.name}${!c.url?'（未読込）':''}</span>
      <span class="clip-dur">${fmt(c.duration)}</span>
      <button class="upBtn" ${i===0?'disabled':''}>↑</button>
      <button class="downBtn" ${i===state.clips.length-1?'disabled':''}>↓</button>
      <button class="seekBtn">再生</button>
      <button class="del delBtn">削除</button>`;
    row.querySelector('.upBtn').addEventListener('click', ()=> moveClip(i,-1));
    row.querySelector('.downBtn').addEventListener('click', ()=> moveClip(i,1));
    row.querySelector('.seekBtn').addEventListener('click', ()=> loadClip(i,0,false));
    row.querySelector('.delBtn').addEventListener('click', ()=> deleteClip(i));
    list.appendChild(row);
  });
}

function moveClip(i, dir){
  const j = i+dir;
  if(j<0 || j>=state.clips.length) return;
  const wasCurrentId = currentClip() ? currentClip().id : null;
  [state.clips[i], state.clips[j]] = [state.clips[j], state.clips[i]];
  if(wasCurrentId) currentClipIndex = state.clips.findIndex(c=>c.id===wasCurrentId);
  renderClipList(); renderOverlayBars(); updateClipBadge();
}

function deleteClip(i){
  const removed = state.clips[i];
  if(!confirm('「'+removed.name+'」を削除しますか？ このクリップに紐づくテキストも削除されます。')) return;
  state.clips.splice(i,1);
  state.overlays = state.overlays.filter(o=>o.clipId!==removed.id);
  if(state.clips.length===0){
    video.removeAttribute('src'); video.style.display='none'; emptyStage.style.display='block';
    currentClipIndex = 0;
  } else {
    const newIndex = Math.min(i, state.clips.length-1);
    loadClip(newIndex, 0, false);
  }
  renderClipList(); renderSide(); renderOverlayBars(); updateOverlayContext();
}

/* ---------- video events ---------- */
video.addEventListener('timeupdate', ()=>{ updateTimecode(); updateOverlayContext(); checkPauseTrigger(); });
video.addEventListener('seeked', ()=>{ resetPauseTriggersAhead(); });
video.addEventListener('ended', ()=>{
  if(mode!=='preview') return;
  if(currentClipIndex < state.clips.length-1){
    loadClip(currentClipIndex+1, 0, true);
  } else {
    showQuiz();
  }
});

function updateTimecode(){
  const d = video.duration || 0;
  const globalNow = clipOffset(currentClipIndex) + (video.currentTime||0);
  $('#timecodeLabel').textContent = fmt(globalNow)+' / '+fmt(totalDuration()||d);
  const total = totalDuration();
  playhead.style.left = (total? (globalNow/total*100):0)+'%';
}

/* ---------- timeline ---------- */
timelineTrack.addEventListener('click', e=>{
  const total = totalDuration();
  if(!total) return;
  const rect = timelineTrack.getBoundingClientRect();
  const ratio = Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  const globalT = ratio*total;
  let idx = 0, local = globalT;
  for(let i=0;i<state.clips.length;i++){
    const d = state.clips[i].duration||0;
    if(local <= d || i===state.clips.length-1){ idx = i; break; }
    local -= d;
  }
  loadClip(idx, Math.max(0,local), false);
});

$('#addOverlayBtn').addEventListener('click', ()=>{
  const c = currentClip();
  if(!c){ alert('先に動画を選択してください'); return; }
  const start = video.currentTime;
  const end = Math.min(start+3, c.duration||start+3);
  state.overlays.push({id:uid(), clipId:c.id, text:'テキストを入力', start, end, x:50, y:82, color:'#F4F1E6', size:28, pause:0});
  renderSide(); renderOverlayBars(); updateOverlayContext();
});

function renderOverlayBars(){
  timelineTrack.querySelectorAll('.timeline-bar, .clip-divider, .clip-tag').forEach(b=>b.remove());
  const total = totalDuration();
  if(!total) return;
  let acc = 0;
  state.clips.forEach((c,i)=>{
    if(i>0){
      const div = document.createElement('div');
      div.className = 'clip-divider';
      div.style.left = (acc/total*100)+'%';
      timelineTrack.appendChild(div);
    }
    const tag = document.createElement('div');
    tag.className = 'clip-tag';
    tag.style.left = (acc/total*100+0.3)+'%';
    tag.textContent = (i+1)+'. '+c.name;
    timelineTrack.appendChild(tag);
    acc += (c.duration||0);
  });
  state.overlays.forEach(o=>{
    const ci = state.clips.findIndex(c=>c.id===o.clipId);
    if(ci===-1) return;
    const off = clipOffset(ci);
    const bar = document.createElement('div');
    bar.className = 'timeline-bar' + (o.pause>0 ? ' has-pause' : '');
    bar.style.top = '32px';
    bar.style.left = ((off+o.start)/total*100)+'%';
    bar.style.width = Math.max(((o.end-o.start)/total*100),1.2)+'%';
    bar.textContent = (o.pause>0 ? '⏸ ' : '') + o.text;
    timelineTrack.appendChild(bar);
  });
}

/* ---------- overlay rendering on video ---------- */
function updateOverlayContext(){
  overlayLayer.innerHTML = '';
  const t = video.currentTime;
  overlaysForCurrentClip().forEach(o=>{
    if(!(t>=o.start && t<=o.end)) return;
    const el = document.createElement('div');
    el.className = 'overlay-item' + (activePauseOverlayId===o.id ? ' pausing' : '');
    el.textContent = o.text;
    el.style.left = o.x+'%';
    el.style.top = o.y+'%';
    el.style.color = o.color;
    el.style.fontSize = o.size+'px';
    el.dataset.id = o.id;
    if(mode==='edit'){
      el.addEventListener('pointerdown', startDrag);
    }
    overlayLayer.appendChild(el);
  });
}

function startDrag(e){
  const el = e.currentTarget;
  dragId = el.dataset.id;
  el.classList.add('dragging');
  const move = ev=>{
    const rect = videoStage.getBoundingClientRect();
    let x = ((ev.clientX-rect.left)/rect.width)*100;
    let y = ((ev.clientY-rect.top)/rect.height)*100;
    x = Math.max(2,Math.min(98,x));
    y = Math.max(4,Math.min(96,y));
    el.style.left = x+'%';
    el.style.top = y+'%';
    const o = state.overlays.find(o=>o.id===dragId);
    if(o){ o.x = x; o.y = y; }
  };
  const up = ()=>{
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

/* ---------- pause-on-text playback (preview mode) ---------- */
function checkPauseTrigger(){
  if(mode!=='preview') return;
  if(pendingPauseTimer) return; // already pausing
  const t = video.currentTime;
  const hit = overlaysForCurrentClip().find(o=>
    o.pause>0 && !o._triggered && t>=o.start && t < o.end
  );
  if(hit) triggerPause(hit);
}

function resetPauseTriggersAhead(){
  // if the user scrubs before an overlay's start, allow it to trigger again
  const t = video.currentTime;
  overlaysForCurrentClip().forEach(o=>{ if(t < o.start) o._triggered = false; });
}

function triggerPause(o){
  o._triggered = true;
  activePauseOverlayId = o.id;
  video.pause();
  updateOverlayContext();
  let remaining = Math.round(o.pause);
  pauseBadge.classList.add('show');
  pauseBadgeText.textContent = '一時停止中… 残り '+remaining+' 秒';
  const tick = ()=>{
    remaining -= 1;
    if(remaining<=0){ resumeFromPause(); return; }
    pauseBadgeText.textContent = '一時停止中… 残り '+remaining+' 秒';
    pendingPauseTimer = setTimeout(tick, 1000);
  };
  pendingPauseTimer = setTimeout(tick, 1000);
}

function resumeFromPause(){
  if(pendingPauseTimer){ clearTimeout(pendingPauseTimer); pendingPauseTimer = null; }
  pauseBadge.classList.remove('show');
  activePauseOverlayId = null;
  updateOverlayContext();
  if(mode==='preview') video.play().catch(()=>{});
}

$('#pauseSkipBtn').addEventListener('click', resumeFromPause);

/* ---------- quiz viewer ---------- */
function showQuiz(){
  if(state.quiz.length===0){
    quizOverlay.innerHTML = `<div class="complete-box"><h2 style="color:var(--chalk)">視聴が完了しました</h2><p>この教材にはクイズが設定されていません。</p></div>`;
    quizOverlay.classList.add('show');
    return;
  }
  let html = `<h2>視聴おつかれさまでした</h2><p class="sub">内容を振り返るクイズです。すべて回答して「採点する」を押してください。</p>`;
  state.quiz.forEach((q,qi)=>{
    html += `<div class="qv-question" data-qid="${q.id}">
      <p class="qtext">Q${qi+1}. ${q.question || '(問題文未設定)'}</p>
      ${q.choices.map((c,i)=>`
        <label class="qv-opt" data-i="${i}">
          <input type="radio" name="ans-${q.id}" value="${i}"> ${c || '(選択肢未設定)'}
        </label>`).join('')}
    </div>`;
  });
  html += `<div class="qv-actions">
    <button class="btn primary" id="gradeBtn">採点する</button>
    <button class="btn ghost" id="retryBtn">もう一度視聴する</button>
    <span class="score-line" id="scoreLine"></span>
  </div>`;
  quizOverlay.innerHTML = html;
  quizOverlay.classList.add('show');

  quizOverlay.querySelector('#gradeBtn').addEventListener('click', ()=>{
    let correctCount = 0;
    state.quiz.forEach(q=>{
      const block = quizOverlay.querySelector(`.qv-question[data-qid="${q.id}"]`);
      const checked = block.querySelector('input[type=radio]:checked');
      const chosen = checked ? +checked.value : -1;
      if(chosen===q.correct) correctCount++;
      block.querySelectorAll('.qv-opt').forEach((opt,i)=>{
        opt.classList.remove('correct','incorrect');
        if(i===q.correct) opt.classList.add('correct');
        else if(i===chosen) opt.classList.add('incorrect');
      });
    });
    quizOverlay.querySelector('#scoreLine').textContent = `結果: ${correctCount} / ${state.quiz.length} 問正解`;
  });
  quizOverlay.querySelector('#retryBtn').addEventListener('click', ()=>{
    quizOverlay.classList.remove('show');
    quizOverlay.innerHTML='';
    state.overlays.forEach(o=> o._triggered=false);
    loadClip(0, 0, true);
  });
}

/* ---------- save / load ---------- */
/* ---------- storage (browser localStorage — works as a standalone app, no external service needed) ---------- */
const STORAGE_PREFIX = 'elearning-course:';

function isStorageAvailable(){
  try{
    const t = '__storage_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){
    return false;
  }
}

async function storageSet(key, value){
  try{
    window.localStorage.setItem(key, value);
    return { key, value, shared:false };
  }catch(err){
    // e.g. quota exceeded
    throw err;
  }
}

async function storageGet(key){
  const value = window.localStorage.getItem(key);
  if(value===null) throw new Error('見つかりませんでした: ' + key);
  return { key, value, shared:false };
}

async function storageList(prefix){
  const keys = [];
  for(let i=0;i<window.localStorage.length;i++){
    const k = window.localStorage.key(i);
    if(k && k.indexOf(prefix||'')===0) keys.push(k);
  }
  return { keys, prefix };
}

async function storageDelete(key){
  window.localStorage.removeItem(key);
  return { key, deleted:true };
}

function sanitizeKeyPart(s){
  // storage keys cannot contain whitespace, path separators (/ \) or quotes ('  ")
  return String(s).replace(/[\s\/\\'"]+/g, '-').replace(/-+/g,'-').slice(0,60) || 'course';
}

$('#saveBtn').addEventListener('click', async ()=>{
  state.title = $('#courseTitle').value.trim();
  if(!state.title){ alert('コース名を入力してください'); return; }
  if(!state.courseId) state.courseId = uid(); // stable id so the storage key never breaks on rename/special characters
  const key = STORAGE_PREFIX + state.courseId;
  const payload = {
    title: state.title,
    clips: state.clips.map(c=>({ id:c.id, name:c.name, duration:c.duration })), // file itself is not persisted
    overlays: state.overlays.map(({_triggered, ...rest})=>rest),
    quiz: state.quiz,
    savedAt: Date.now()
  };
  const statusEl = $('#saveStatus');
  statusEl.classList.remove('error');

  if(!isStorageAvailable()){
    statusEl.classList.add('error');
    statusEl.textContent = 'この端末のブラウザでは保存できません';
    setTimeout(()=>{ statusEl.textContent=''; statusEl.classList.remove('error'); }, 4000);
    return;
  }

  statusEl.textContent = '保存中…';
  try{
    const json = JSON.stringify(payload);
    const res = await storageSet(key, json);
    if(res){
      statusEl.textContent = '保存しました';
    } else {
      statusEl.classList.add('error');
      statusEl.textContent = '保存に失敗しました';
    }
  }catch(err){
    console.error('save error', err);
    statusEl.classList.add('error');
    statusEl.textContent = '保存エラー: ' + (err && err.message ? err.message : '不明なエラー');
  }
  setTimeout(()=>{ statusEl.textContent=''; statusEl.classList.remove('error'); }, 4000);
});

$('#loadBtn').addEventListener('click', async ()=>{
  if(!isStorageAvailable()){
    alert('この端末のブラウザでは保存/読み込み機能が使えません（プライベートブラウズ中などはlocalStorageが制限されることがあります）。');
    return;
  }
  let list;
  try{
    list = await storageList(STORAGE_PREFIX);
  }catch(err){ alert('一覧の取得に失敗しました: '+(err&&err.message?err.message:'')); return; }
  if(!list || !list.keys || list.keys.length===0){ alert('保存されたコースがありません'); return; }

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:999;';
  modal.innerHTML = `<div style="background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:18px;width:360px;max-height:70vh;overflow-y:auto;">
    <h3 style="margin:0 0 12px;font-size:15px;">保存済みコース</h3>
    <div id="courseList" style="display:flex;flex-direction:column;gap:8px;"></div>
    <button class="btn ghost" id="closeModal" style="margin-top:14px;width:100%;">閉じる</button>
  </div>`;
  document.body.appendChild(modal);
  const listEl = modal.querySelector('#courseList');

  for(const key of list.keys){
    try{
      const res = await storageGet(key);
      const data = JSON.parse(res.value);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;';
      const clipCount = (data.clips||[]).length;
      row.innerHTML = `<button class="btn" style="flex:1;text-align:left;">${data.title}<br><span style="font-size:11px;color:var(--chalk-dim)">クリップ ${clipCount}本</span></button><button class="small-btn del">削除</button>`;
      row.querySelector('button.btn').addEventListener('click', ()=>{
        state.courseId = key.replace(STORAGE_PREFIX,'');
        state.title = data.title || '';
        state.quiz = data.quiz || [];
        state.overlays = (data.overlays||[]).map(o=>({ pause:0, ...o }));
        // clips only keep metadata; url must be re-selected by the user
        state.clips = (data.clips||[]).map(c=>({ id:c.id, name:c.name, duration:c.duration, url:null }));
        currentClipIndex = 0;
        $('#courseTitle').value = state.title;
        renderSide(); renderClipList(); renderOverlayBars();
        if(state.clips.length>0){
          alert('動画ファイル本体は保存されていません。「動画を追加」から、以下の順番でファイルを選び直してください：\n'+state.clips.map((c,i)=>(i+1)+'. '+c.name).join('\n'));
        }
        modal.remove();
      });
      row.querySelector('.del').addEventListener('click', async ()=>{
        try{
          await storageDelete(key);
          row.remove();
        }catch(e){ alert('削除に失敗しました'); }
      });
      listEl.appendChild(row);
    }catch(e){ /* skip unreadable entry */ }
  }
  modal.querySelector('#closeModal').addEventListener('click', ()=> modal.remove());
});

  note.textContent = '※ このブラウザでは保存/読み込み機能が使えません。';
  $('#saveStatus').insertAdjacentElement('afterend', note);
}
</script>
