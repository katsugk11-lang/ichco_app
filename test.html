<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テロップ教材ビルダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B1A;
    --panel:#242220;
    --panel-2:#2D2A27;
    --panel-3:#38342f;
    --border:#3C3833;
    --text:#EDEAE4;
    --text-dim:#9C968C;
    --text-faint:#6E685F;
    --amber:#D4A54A;
    --amber-dim:rgba(212,165,74,0.18);
    --amber-line:rgba(212,165,74,0.45);
    --teal:#5FA8A0;
    --teal-dim:rgba(95,168,160,0.18);
    --danger:#C1594A;
    --danger-dim:rgba(193,89,74,0.18);
    --radius:10px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Shippori Mincho', serif;}
  button{font-family:inherit;}
  ::selection{background:var(--amber-dim);}

  /* ---------- App shell ---------- */
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:var(--bg); z-index:20;
    gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:28px; height:28px; border-radius:6px;
    background:linear-gradient(135deg, var(--amber), var(--teal));
    flex-shrink:0;
  }
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.02em;}
  .brand .sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .header-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:9px 16px; border-radius:999px; font-size:13.5px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint); background:var(--panel-3);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--amber); color:#211a08; border-color:var(--amber); font-weight:700;}
  .btn-primary:hover{background:#e0b25c; border-color:#e0b25c;}
  .btn-teal{background:var(--teal); color:#0e2624; border-color:var(--teal); font-weight:700;}
  .btn-teal:hover{background:#71bcb3;}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--panel-2); border-color:var(--border);}
  .btn-danger{color:var(--danger); border-color:var(--danger-dim);}
  .btn-danger:hover{background:var(--danger-dim);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn[disabled]{opacity:.4; cursor:not-allowed;}

  main{max-width:1180px; margin:0 auto; padding:28px 24px 80px;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- List screen ---------- */
  .list-hero{margin-bottom:28px;}
  .list-hero h2{font-size:26px; margin:0 0 6px;}
  .list-hero p{color:var(--text-dim); margin:0; font-size:14px; line-height:1.7;}
  .project-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:14px; margin-top:20px;
  }
  .project-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; display:flex; flex-direction:column; gap:10px; cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .project-card:hover{border-color:var(--amber-line); transform:translateY(-2px);}
  .project-card .title{font-weight:700; font-size:15.5px; line-height:1.4;}
  .project-card .meta{font-size:12px; color:var(--text-dim); display:flex; gap:10px; flex-wrap:wrap;}
  .project-card .meta span{display:flex; align-items:center; gap:4px;}
  .project-card .row-actions{display:flex; gap:8px; margin-top:4px;}
  .new-card{
    border:1.5px dashed var(--border); border-radius:var(--radius); padding:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; cursor:pointer; color:var(--text-dim); min-height:120px;
    transition:border-color .15s, color .15s;
  }
  .new-card:hover{border-color:var(--amber-line); color:var(--amber);}
  .new-card .plus{font-size:26px; line-height:1;}
  .empty-note{color:var(--text-faint); font-size:13px; padding:30px 0; text-align:center;}

  /* ---------- Editor screen ---------- */
  .editor-title-row{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .title-input{
    background:transparent; border:none; border-bottom:1px solid transparent; color:var(--text);
    font-family:'Shippori Mincho', serif; font-size:22px; font-weight:700; padding:4px 2px;
    min-width:200px; flex:1;
  }
  .title-input:focus{outline:none; border-bottom-color:var(--amber-line);}
  .dirty-dot{width:7px; height:7px; border-radius:50%; background:var(--amber); display:none;}
  .dirty-dot.show{display:inline-block;}

  .editor-grid{display:grid; grid-template-columns:1fr 340px; gap:22px;}
  @media (max-width:880px){ .editor-grid{grid-template-columns:1fr;} }

  .video-panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .video-wrap{position:relative; background:#000; border-radius:var(--radius-sm); overflow:hidden; aspect-ratio:16/9;}
  .video-wrap video{width:100%; height:100%; display:block; background:#000;}
  .video-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--text-dim); text-align:center; padding:20px;
  }
  .caption-overlay{position:absolute; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; padding:0 6%;}
  .cap-top{top:6%;}
  .cap-center{top:50%; transform:translateY(-50%);}
  .cap-bottom{bottom:7%;}
  .cap-line{
    background:rgba(10,10,10,.72); color:#fff; padding:6px 14px; border-radius:6px;
    font-size:clamp(13px,2.4vw,18px); font-weight:500; text-align:center; max-width:100%;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);
  }

  .file-row{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .file-row input[type=file]{display:none;}
  .file-name{font-size:12px; color:var(--text-dim);}

  .timeline-section{margin-top:18px;}
  .timeline-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .timeline-head h3{font-size:13px; margin:0; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.06em; font-family:inherit;}
  .timeline-outer{position:relative; padding-top:8px;}
  .ticks{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-faint); padding:0 2px 4px;}
  .timeline{
    position:relative; height:64px; background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius-sm); overflow:hidden; cursor:pointer;
  }
  .timeline-track-label{position:absolute; left:8px; top:6px; font-size:10px; color:var(--text-faint); letter-spacing:.05em; pointer-events:none;}
  .playhead{position:absolute; top:0; bottom:0; width:2px; background:var(--amber); box-shadow:0 0 6px var(--amber); pointer-events:none; z-index:5;}
  .playhead::before{content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:9px; height:9px; border-radius:50%; background:var(--amber);}
  .caption-block{
    position:absolute; top:22px; height:34px; border-radius:5px; background:var(--amber-dim);
    border:1px solid var(--amber-line); display:flex; align-items:center; overflow:hidden;
    cursor:grab; min-width:10px;
  }
  .caption-block.selected{background:var(--teal-dim); border-color:var(--teal);}
  .caption-block .lbl{font-size:11px; color:var(--text); padding:0 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none;}
  .resize-handle{position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize;}
  .resize-handle.left{left:0;}
  .resize-handle.right{right:0;}

  .add-cap-row{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .add-cap-row .time-badge{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}

  /* Sidebar tabs */
  .side-panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; max-height:none;}
  .tabbar{display:flex; border-bottom:1px solid var(--border);}
  .tabbtn{flex:1; padding:13px 10px; background:transparent; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tabbtn.active{color:var(--text); border-bottom-color:var(--amber);}
  .tabpane{display:none; padding:16px; flex:1; overflow-y:auto;}
  .tabpane.active{display:block;}

  .field-label{font-size:11px; color:var(--text-dim); margin:0 0 4px; display:block; letter-spacing:.03em;}
  .field-input, .field-textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:8px 10px; font-size:13.5px; font-family:inherit; resize:vertical;
  }
  .field-input:focus, .field-textarea:focus{outline:none; border-color:var(--amber-line);}
  .field-group{margin-bottom:12px;}
  .time-fields{display:flex; gap:8px;}
  .time-fields > div{flex:1;}
  .position-select{display:flex; gap:6px;}
  .position-select button{flex:1; padding:6px; font-size:11.5px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim); cursor:pointer;}
  .position-select button.active{background:var(--amber-dim); border-color:var(--amber-line); color:var(--text);}

  .empty-side{color:var(--text-faint); font-size:12.5px; text-align:center; padding:24px 8px; line-height:1.7;}

  .quiz-card{background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:12px;}
  .quiz-card .qtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .quiz-card .qnum{font-size:11px; color:var(--text-dim); font-weight:700;}
  .choice-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .choice-row input[type=radio]{accent-color:var(--teal); flex-shrink:0;}
  .choice-row input[type=text]{flex:1;}

  /* ---------- Preview screen ---------- */
  .preview-wrap{max-width:760px; margin:0 auto;}
  .preview-video-wrap{position:relative; background:#000; border-radius:var(--radius); overflow:hidden; aspect-ratio:16/9; border:1px solid var(--border);}
  .preview-video-wrap video{width:100%; height:100%; display:block;}
  .quiz-section{margin-top:26px; display:none;}
  .quiz-section.show{display:block;}
  .quiz-section h2{font-size:20px; margin:0 0 4px;}
  .quiz-section .lead{color:var(--text-dim); font-size:13.5px; margin:0 0 20px;}
  .pq-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px;}
  .pq-card.correct{border-color:var(--teal);}
  .pq-card.incorrect{border-color:var(--danger);}
  .pq-card .pq-q{font-weight:700; font-size:15px; margin-bottom:12px; line-height:1.6;}
  .pq-choice{
    display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border); margin-bottom:7px; cursor:pointer; font-size:13.5px; line-height:1.6;
  }
  .pq-choice:hover{border-color:var(--text-faint);}
  .pq-choice input{margin-top:3px; accent-color:var(--teal);}
  .pq-choice.mark-correct{border-color:var(--teal); background:var(--teal-dim);}
  .pq-choice.mark-incorrect{border-color:var(--danger); background:var(--danger-dim);}
  .pq-explain{font-size:12.5px; color:var(--text-dim); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); line-height:1.7; display:none;}
  .pq-explain.show{display:block;}
  .score-banner{
    border-radius:var(--radius); padding:22px; text-align:center; margin-bottom:20px; border:1px solid var(--border);
  }
  .score-banner .num{font-family:'Shippori Mincho', serif; font-size:34px; font-weight:700; margin:0 0 4px;}
  .score-banner .msg{font-size:13.5px; color:var(--text-dim);}
  .score-good{border-color:var(--teal); background:var(--teal-dim);}
  .score-mid{border-color:var(--amber); background:var(--amber-dim);}
  .score-low{border-color:var(--danger); background:var(--danger-dim);}
  .after-video-cta{display:flex; justify-content:center; margin-top:14px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-3); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50; box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .footnote{font-size:11.5px; color:var(--text-faint); margin-top:8px; line-height:1.6;}
</style>
</head>
<body>

<div class="app-header">
  <div class="brand" id="brandHome" style="cursor:pointer;">
    <div class="mark"></div>
    <div>
      <h1>テロップ教材ビルダー</h1>
      <div class="sub">動画 × テロップ × クイズで研修教材をひとつに</div>
    </div>
  </div>
  <div class="header-right" id="headerActions"></div>
</div>

<main>
  <!-- LIST SCREEN -->
  <section class="screen active" id="screen-list">
    <div class="list-hero">
      <h2 class="serif">教材一覧</h2>
      <p>動画に字幕を重ね、視聴後に理解度クイズを出す研修教材を作成します。作った教材はブラウザに自動で保存されます。</p>
    </div>
    <div class="project-grid" id="projectGrid"></div>
  </section>

  <!-- EDITOR SCREEN -->
  <section class="screen" id="screen-editor">
    <div class="editor-title-row">
      <input class="title-input" id="titleInput" placeholder="教材のタイトルを入力">
      <span class="dirty-dot" id="dirtyDot" title="未保存の変更があります"></span>
    </div>

    <div class="editor-grid">
      <div>
        <div class="video-panel">
          <div class="video-wrap" id="videoWrap">
            <video id="videoEl" playsinline></video>
            <div class="video-empty" id="videoEmpty">
              <div>この教材にはまだ動画がありません</div>
              <button class="btn btn-primary btn-sm" id="pickVideoBtn2">動画ファイルを選ぶ</button>
            </div>
            <div id="captionOverlay"></div>
          </div>
          <div class="file-row">
            <input type="file" id="fileInput" accept="video/*">
            <button class="btn btn-sm" id="pickVideoBtn">動画ファイルを選ぶ</button>
            <span class="file-name" id="fileNameLabel">動画未選択</span>
          </div>
          <div class="footnote">動画そのものはブラウザに保存されません。次にこの教材を開くときは、同じ動画ファイルを選び直してください。字幕とクイズは自動保存されます。</div>

          <div class="timeline-section">
            <div class="timeline-head">
              <h3>タイムライン（テロップ配置）</h3>
              <span class="time-badge" id="curTimeLabel">00:00 / 00:00</span>
            </div>
            <div class="timeline-outer">
              <div class="timeline" id="timeline">
                <div class="timeline-track-label">クリックで再生位置を移動・ドラッグでテロップ調整</div>
                <div class="playhead" id="playhead" style="left:0%"></div>
              </div>
              <div class="ticks" id="ticks"></div>
            </div>
            <div class="add-cap-row">
              <button class="btn btn-teal btn-sm" id="addCapBtn">＋ 今の位置にテロップを追加</button>
              <span class="time-badge" id="addAtLabel"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <div class="tabbar">
          <button class="tabbtn active" data-tab="cap">テロップ</button>
          <button class="tabbtn" data-tab="quiz">クイズ</button>
        </div>

        <div class="tabpane active" id="tab-cap">
          <div id="capEditorArea"></div>
        </div>

        <div class="tabpane" id="tab-quiz">
          <div id="quizList"></div>
          <button class="btn btn-teal btn-sm" id="addQuizBtn" style="width:100%; justify-content:center; margin-top:4px;">＋ 設問を追加</button>
        </div>
      </div>
    </div>
  </section>

  <!-- PREVIEW SCREEN -->
  <section class="screen" id="screen-preview">
    <div class="preview-wrap">
      <h2 class="serif" id="previewTitle" style="margin-top:0;"></h2>
      <div class="preview-video-wrap">
        <video id="previewVideo" playsinline controls></video>
        <div id="previewCaptionOverlay"></div>
      </div>
      <div class="after-video-cta" id="rewatchRow" style="display:none;">
        <button class="btn btn-sm" id="rewatchBtn">もう一度見る</button>
      </div>

      <div class="quiz-section" id="quizSection">
        <h2 class="serif">理解度チェック</h2>
        <p class="lead">視聴お疲れさまでした。内容を振り返りながら答えてください。</p>
        <div id="quizRunner"></div>
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button class="btn btn-primary" id="gradeBtn">採点する</button>
          <button class="btn" id="retryQuizBtn" style="display:none;">もう一度挑戦する</button>
        </div>
        <div id="scoreArea" style="margin-top:18px;"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== storage helpers ===================== */
  async function idxGet(){
    try{
      const r = await window.storage.get('projects-index', false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ return []; }
  }
  async function idxSave(list){
    try{ await window.storage.set('projects-index', JSON.stringify(list), false); }catch(e){}
  }
  async function projGet(id){
    try{
      const r = await window.storage.get('project:'+id, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function projSave(p){
    try{ await window.storage.set('project:'+p.id, JSON.stringify(p), false); }catch(e){}
    const list = await idxGet();
    const meta = {id:p.id, title:p.title, updatedAt:Date.now(), captionCount:p.captions.length, quizCount:p.quiz.length};
    const i = list.findIndex(x=>x.id===p.id);
    if(i>=0) list[i]=meta; else list.unshift(meta);
    await idxSave(list);
  }
  async function projDelete(id){
    try{ await window.storage.delete('project:'+id, false); }catch(e){}
    const list = await idxGet();
    await idxSave(list.filter(x=>x.id!==id));
  }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function fmtTime(s){
    s = Math.max(0, s||0);
    const m = Math.floor(s/60), sec = Math.floor(s%60);
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function fmtDate(ts){
    const d = new Date(ts);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  let toastTimer=null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function newProjectTemplate(){
    return {id:uid(), title:'無題の教材', duration:0, captions:[], quiz:[], createdAt:Date.now()};
  }

  /* ===================== app state ===================== */
  let project = null;
  let isDirty = false;
  let selectedCapId = null;
  let videoUrl = null;
  let currentTab = 'cap';

  const screens = {
    list: document.getElementById('screen-list'),
    editor: document.getElementById('screen-editor'),
    preview: document.getElementById('screen-preview'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
    renderHeaderActions(name);
  }

  const headerActions = document.getElementById('headerActions');
  function renderHeaderActions(screenName){
    headerActions.innerHTML = '';
    if(screenName==='editor'){
      const back = mkBtn('一覧へ戻る', ()=>{ goList(); }, 'btn btn-ghost btn-sm');
      const prev = mkBtn('プレビュー', ()=>{ openPreview(); }, 'btn btn-sm');
      const save = mkBtn('保存する', ()=>{ doSave(); }, 'btn btn-primary btn-sm');
      headerActions.append(back, prev, save);
    } else if(screenName==='preview'){
      const back = mkBtn('編集へ戻る', ()=>{ showScreen('editor'); }, 'btn btn-ghost btn-sm');
      headerActions.append(back);
    }
  }
  function mkBtn(label, onClick, cls){
    const b = document.createElement('button');
    b.className = cls || 'btn btn-sm';
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  document.getElementById('brandHome').addEventListener('click', goList);

  function markDirty(){ isDirty = true; document.getElementById('dirtyDot').classList.add('show'); }
  function clearDirty(){ isDirty = false; document.getElementById('dirtyDot').classList.remove('show'); }

  /* ===================== LIST screen ===================== */
  async function goList(){
    if(videoUrl){ URL.revokeObjectURL(videoUrl); videoUrl=null; }
    project = null;
    showScreen('list');
    await renderList();
  }
  async function renderList(){
    const grid = document.getElementById('projectGrid');
    grid.innerHTML = '';
    const list = await idxGet();
    list.sort((a,b)=>b.updatedAt-a.updatedAt);

    const newCard = document.createElement('div');
    newCard.className = 'new-card';
    newCard.innerHTML = '<div class="plus">＋</div><div>新しい教材を作る</div>';
    newCard.addEventListener('click', async ()=>{
      project = newProjectTemplate();
      selectedCapId = null;
      videoUrl = null;
      openEditor();
    });
    grid.appendChild(newCard);

    list.forEach(meta=>{
      const card = document.createElement('div');
      card.className = 'project-card';
      const title = document.createElement('div');
      title.className = 'title'; title.textContent = meta.title || '無題の教材';
      const metaRow = document.createElement('div');
      metaRow.className = 'meta';
      metaRow.innerHTML = '<span>🎬 テロップ '+meta.captionCount+'</span><span>📝 クイズ '+meta.quizCount+'</span><span>🕓 '+fmtDate(meta.updatedAt)+'</span>';
      const actions = document.createElement('div');
      actions.className = 'row-actions';
      const openBtn = mkBtn('開く', async (e)=>{ e.stopPropagation(); const p = await projGet(meta.id); if(p){ project=p; videoUrl=null; selectedCapId=null; openEditor(); } }, 'btn btn-sm');
      const delBtn = mkBtn('削除', async (e)=>{ e.stopPropagation(); if(confirm('「'+(meta.title||'無題の教材')+'」を削除しますか？この操作は取り消せません。')){ await projDelete(meta.id); await renderList(); toast('削除しました'); } }, 'btn btn-sm btn-danger');
      actions.append(openBtn, delBtn);
      card.append(title, metaRow, actions);
      card.addEventListener('click', ()=>openBtn.click());
      grid.appendChild(card);
    });

    if(list.length===0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.style.gridColumn = '1/-1';
      note.textContent = 'まだ教材がありません。「＋ 新しい教材を作る」から始めましょう。';
      grid.appendChild(note);
    }
  }

  /* ===================== EDITOR screen ===================== */
  const videoEl = document.getElementById('videoEl');
  const videoEmpty = document.getElementById('videoEmpty');
  const fileInput = document.getElementById('fileInput');
  const captionOverlay = document.getElementById('captionOverlay');
  const timelineEl = document.getElementById('timeline');
  const playheadEl = document.getElementById('playhead');
  const titleInput = document.getElementById('titleInput');

  function openEditor(){
    titleInput.value = project.title;
    videoEl.removeAttribute('src');
    videoEmpty.style.display = 'flex';
    videoEl.style.display = 'none';
    document.getElementById('fileNameLabel').textContent = project.videoFileName ? project.videoFileName+'（再選択してください）' : '動画未選択';
    clearDirty();
    selectedCapId = null;
    switchTab('cap');
    renderTimeline();
    renderCapEditor();
    renderQuizList();
    updateTimeLabel();
    showScreen('editor');
  }

  titleInput.addEventListener('input', ()=>{ project.title = titleInput.value || '無題の教材'; markDirty(); });

  function pickVideo(){ fileInput.click(); }
  document.getElementById('pickVideoBtn').addEventListener('click', pickVideo);
  document.getElementById('pickVideoBtn2').addEventListener('click', pickVideo);
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files[0];
    if(!f) return;
    if(videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(f);
    videoEl.src = videoUrl;
    videoEl.style.display = 'block';
    videoEmpty.style.display = 'none';
    project.videoFileName = f.name;
    document.getElementById('fileNameLabel').textContent = f.name;
    markDirty();
  });
  videoEl.addEventListener('loadedmetadata', ()=>{
    project.duration = videoEl.duration || project.duration || 0;
    renderTimeline();
    updateTimeLabel();
  });
  videoEl.addEventListener('timeupdate', ()=>{
    updatePlayhead();
    updateTimeLabel();
    renderCaptionOverlay(videoEl.currentTime, captionOverlay);
  });

  function updateTimeLabel(){
    document.getElementById('curTimeLabel').textContent = fmtTime(videoEl.currentTime||0)+' / '+fmtTime(project.duration||0);
    document.getElementById('addAtLabel').textContent = '追加位置: '+fmtTime(videoEl.currentTime||0);
  }
  function updatePlayhead(){
    const d = project.duration||0;
    const pct = d>0 ? (videoEl.currentTime/d)*100 : 0;
    playheadEl.style.left = pct+'%';
  }

  function renderCaptionOverlay(t, container){
    container.innerHTML = '';
    const active = project.captions.filter(c=>t>=c.start && t<c.end);
    ['top','center','bottom'].forEach(pos=>{
      const items = active.filter(c=>(c.position||'bottom')===pos);
      if(items.length===0) return;
      const wrap = document.createElement('div');
      wrap.className = 'caption-overlay cap-'+pos;
      items.forEach(c=>{
        const line = document.createElement('div');
        line.className = 'cap-line';
        line.textContent = c.text || '';
        wrap.appendChild(line);
      });
      container.appendChild(wrap);
    });
  }

  /* ---- Timeline ---- */
  function renderTicks(){
    const ticks = document.getElementById('ticks');
    ticks.innerHTML = '';
    const d = project.duration||0;
    for(let i=0;i<=4;i++){
      const s = document.createElement('span');
      s.textContent = fmtTime(d*i/4);
      ticks.appendChild(s);
    }
  }

  function renderTimeline(){
    // clear existing blocks (keep playhead)
    Array.from(timelineEl.querySelectorAll('.caption-block')).forEach(b=>b.remove());
    const d = project.duration||0;
    renderTicks();
    if(d<=0){
      return;
    }
    project.captions.forEach(c=>{
      const block = document.createElement('div');
      block.className = 'caption-block'+(c.id===selectedCapId?' selected':'');
      block.dataset.id = c.id;
      const leftPct = (c.start/d)*100;
      const widthPct = Math.max((c.end-c.start)/d*100, 1);
      block.style.left = leftPct+'%';
      block.style.width = widthPct+'%';
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = c.text || '(空のテロップ)';
      const hL = document.createElement('div'); hL.className='resize-handle left';
      const hR = document.createElement('div'); hR.className='resize-handle right';
      block.append(hL, lbl, hR);
      block.addEventListener('mousedown', (e)=>startDrag(e, c.id, 'move'));
      hL.addEventListener('mousedown', (e)=>{ e.stopPropagation(); startDrag(e, c.id, 'left'); });
      hR.addEventListener('mousedown', (e)=>{ e.stopPropagation(); startDrag(e, c.id, 'right'); });
      block.addEventListener('click', (e)=>{ e.stopPropagation(); selectCap(c.id); });
      timelineEl.appendChild(block);
    });
    updatePlayhead();
  }

  timelineEl.addEventListener('click', (e)=>{
    if(e.target !== timelineEl && !e.target.classList.contains('timeline-track-label')) return;
    const d = project.duration||0;
    if(d<=0) return;
    const rect = timelineEl.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX-rect.left)/rect.width));
    videoEl.currentTime = ratio*d;
  });

  let dragState = null;
  function startDrag(e, capId, mode){
    e.preventDefault();
    const d = project.duration||0;
    if(d<=0) return;
    const cap = project.captions.find(c=>c.id===capId);
    if(!cap) return;
    selectCap(capId);
    dragState = {
      capId, mode, startX:e.clientX,
      origStart:cap.start, origEnd:cap.end,
      rectWidth: timelineEl.getBoundingClientRect().width,
      duration: d
    };
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  }
  function onDrag(e){
    if(!dragState) return;
    const cap = project.captions.find(c=>c.id===dragState.capId);
    if(!cap) return;
    const deltaTime = ((e.clientX - dragState.startX)/dragState.rectWidth) * dragState.duration;
    const minGap = 0.3;
    if(dragState.mode==='move'){
      let ns = dragState.origStart + deltaTime;
      let ne = dragState.origEnd + deltaTime;
      const len = dragState.origEnd - dragState.origStart;
      ns = Math.max(0, Math.min(dragState.duration-len, ns));
      ne = ns + len;
      cap.start = ns; cap.end = ne;
    } else if(dragState.mode==='left'){
      let ns = Math.max(0, Math.min(dragState.origEnd-minGap, dragState.origStart+deltaTime));
      cap.start = ns;
    } else if(dragState.mode==='right'){
      let ne = Math.min(dragState.duration, Math.max(dragState.origStart+minGap, dragState.origEnd+deltaTime));
      cap.end = ne;
    }
    renderTimeline();
    if(selectedCapId===cap.id) renderCapEditor();
  }
  function endDrag(){
    if(dragState){ markDirty(); }
    dragState = null;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
  }

  function selectCap(id){
    selectedCapId = id;
    renderTimeline();
    renderCapEditor();
    switchTab('cap');
  }

  document.getElementById('addCapBtn').addEventListener('click', ()=>{
    const d = project.duration||0;
    if(d<=0){ toast('先に動画を選択してください'); return; }
    const start = videoEl.currentTime||0;
    const end = Math.min(d, start+3);
    const cap = {id:uid(), start, end:(end>start?end:Math.min(d,start+0.5)), text:'', position:'bottom'};
    project.captions.push(cap);
    project.captions.sort((a,b)=>a.start-b.start);
    selectedCapId = cap.id;
    markDirty();
    renderTimeline();
    renderCapEditor();
  });

  function renderCapEditor(){
    const area = document.getElementById('capEditorArea');
    area.innerHTML = '';
    const cap = project.captions.find(c=>c.id===selectedCapId);
    if(!cap){
      const empty = document.createElement('div');
      empty.className = 'empty-side';
      empty.textContent = project.captions.length
        ? 'タイムライン上のテロップをクリックすると、ここで編集できます。'
        : '「＋ 今の位置にテロップを追加」からテロップを作成してください。';
      area.appendChild(empty);
      return;
    }
    const g1 = document.createElement('div'); g1.className='field-group';
    g1.innerHTML = '<label class="field-label">テロップ本文</label>';
    const ta = document.createElement('textarea');
    ta.className = 'field-textarea'; ta.rows = 3; ta.value = cap.text;
    ta.addEventListener('input', ()=>{ cap.text = ta.value; markDirty(); renderTimeline(); });
    g1.appendChild(ta);

    const g2 = document.createElement('div'); g2.className='field-group time-fields';
    const sWrap = document.createElement('div');
    sWrap.innerHTML = '<label class="field-label">開始 (秒)</label>';
    const sInput = document.createElement('input'); sInput.type='number'; sInput.step='0.1'; sInput.className='field-input';
    sInput.value = cap.start.toFixed(1);
    sInput.addEventListener('change', ()=>{
      let v = parseFloat(sInput.value); if(isNaN(v)) v = cap.start;
      v = Math.max(0, Math.min(cap.end-0.2, v));
      cap.start = v; markDirty(); renderTimeline(); renderCapEditor();
    });
    sWrap.appendChild(sInput);
    const eWrap = document.createElement('div');
    eWrap.innerHTML = '<label class="field-label">終了 (秒)</label>';
    const eInput = document.createElement('input'); eInput.type='number'; eInput.step='0.1'; eInput.className='field-input';
    eInput.value = cap.end.toFixed(1);
    eInput.addEventListener('change', ()=>{
      let v = parseFloat(eInput.value); if(isNaN(v)) v = cap.end;
      v = Math.min(project.duration||v, Math.max(cap.start+0.2, v));
      cap.end = v; markDirty(); renderTimeline(); renderCapEditor();
    });
    eWrap.appendChild(eInput);
    g2.append(sWrap, eWrap);

    const g3 = document.createElement('div'); g3.className='field-group';
    g3.innerHTML = '<label class="field-label">表示位置</label>';
    const posWrap = document.createElement('div'); posWrap.className='position-select';
    [['top','上'],['center','中央'],['bottom','下']].forEach(([val,label])=>{
      const b = document.createElement('button');
      b.textContent = label; b.type='button';
      if((cap.position||'bottom')===val) b.classList.add('active');
      b.addEventListener('click', ()=>{ cap.position = val; markDirty(); renderCapEditor(); });
      posWrap.appendChild(b);
    });
    g3.appendChild(posWrap);

    const seekBtn = mkBtn('この位置にシーク', ()=>{ videoEl.currentTime = cap.start; }, 'btn btn-sm');
    const delBtn = mkBtn('このテロップを削除', ()=>{
      project.captions = project.captions.filter(c=>c.id!==cap.id);
      selectedCapId = null; markDirty(); renderTimeline(); renderCapEditor();
    }, 'btn btn-sm btn-danger');
    const btnRow = document.createElement('div');
    btnRow.style.display='flex'; btnRow.style.gap='8px'; btnRow.style.marginTop='6px';
    btnRow.append(seekBtn, delBtn);

    area.append(g1, g2, g3, btnRow);
  }

  /* ---- Quiz tab ---- */
  document.querySelectorAll('.tabbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
  });
  function switchTab(name){
    currentTab = name;
    document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
    document.getElementById('tab-cap').classList.toggle('active', name==='cap');
    document.getElementById('tab-quiz').classList.toggle('active', name==='quiz');
  }

  document.getElementById('addQuizBtn').addEventListener('click', ()=>{
    project.quiz.push({id:uid(), question:'', choices:['','','',''], correct:0, explanation:''});
    markDirty();
    renderQuizList();
  });

  function renderQuizList(){
    const list = document.getElementById('quizList');
    list.innerHTML = '';
    if(project.quiz.length===0){
      const empty = document.createElement('div');
      empty.className = 'empty-side';
      empty.textContent = '「＋ 設問を追加」から視聴後クイズを作成してください。';
      list.appendChild(empty);
      return;
    }
    project.quiz.forEach((q, idx)=>{
      const card = document.createElement('div');
      card.className = 'quiz-card';

      const top = document.createElement('div'); top.className='qtop';
      const num = document.createElement('div'); num.className='qnum'; num.textContent = '設問 '+(idx+1);
      const del = mkBtn('削除', ()=>{ project.quiz = project.quiz.filter(x=>x.id!==q.id); markDirty(); renderQuizList(); }, 'btn btn-sm btn-danger');
      top.append(num, del);

      const qLabel = document.createElement('label'); qLabel.className='field-label'; qLabel.textContent='問題文';
      const qInput = document.createElement('textarea'); qInput.className='field-textarea'; qInput.rows=2; qInput.value=q.question;
      qInput.addEventListener('input', ()=>{ q.question = qInput.value; markDirty(); });

      const choicesWrap = document.createElement('div'); choicesWrap.style.marginTop='10px';
      const cLabel = document.createElement('label'); cLabel.className='field-label'; cLabel.textContent='選択肢（正解をマーク）';
      choicesWrap.appendChild(cLabel);
      q.choices.forEach((ch, ci)=>{
        const row = document.createElement('div'); row.className='choice-row';
        const radio = document.createElement('input'); radio.type='radio'; radio.name='correct-'+q.id;
        radio.checked = q.correct===ci;
        radio.addEventListener('change', ()=>{ q.correct = ci; markDirty(); });
        const txt = document.createElement('input'); txt.type='text'; txt.className='field-input';
        txt.placeholder = '選択肢 '+(ci+1); txt.value = ch;
        txt.addEventListener('input', ()=>{ q.choices[ci] = txt.value; markDirty(); });
        row.append(radio, txt);
        choicesWrap.appendChild(row);
      });

      const eLabel = document.createElement('label'); eLabel.className='field-label'; eLabel.textContent='解説（任意）'; eLabel.style.marginTop='6px'; eLabel.style.display='block';
      const eInput = document.createElement('textarea'); eInput.className='field-textarea'; eInput.rows=2; eInput.value=q.explanation;
      eInput.addEventListener('input', ()=>{ q.explanation = eInput.value; markDirty(); });

      card.append(top, qLabel, qInput, choicesWrap, eLabel, eInput);
      list.appendChild(card);
    });
  }

  async function doSave(){
    if(!project.title) project.title = '無題の教材';
    await projSave(project);
    clearDirty();
    toast('保存しました');
  }

  /* ===================== PREVIEW screen ===================== */
  const previewVideo = document.getElementById('previewVideo');
  const previewOverlay = document.getElementById('previewCaptionOverlay');
  const quizSection = document.getElementById('quizSection');
  const rewatchRow = document.getElementById('rewatchRow');

  function openPreview(){
    document.getElementById('previewTitle').textContent = project.title || '無題の教材';
    quizSection.classList.remove('show');
    rewatchRow.style.display = 'none';
    document.getElementById('scoreArea').innerHTML = '';
    document.getElementById('retryQuizBtn').style.display = 'none';
    if(videoUrl){
      previewVideo.src = videoUrl;
    } else {
      toast('動画が未選択のため、プレビューできません');
    }
    renderQuizRunner();
    showScreen('preview');
  }

  previewVideo.addEventListener('timeupdate', ()=>{
    renderCaptionOverlay(previewVideo.currentTime, previewOverlay);
  });
  previewVideo.addEventListener('ended', ()=>{
    quizSection.classList.add('show');
    rewatchRow.style.display = 'flex';
    quizSection.scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('rewatchBtn').addEventListener('click', ()=>{
    previewVideo.currentTime = 0;
    previewVideo.play();
  });

  function renderQuizRunner(){
    const runner = document.getElementById('quizRunner');
    runner.innerHTML = '';
    project.quiz.forEach((q, idx)=>{
      const card = document.createElement('div');
      card.className = 'pq-card';
      card.dataset.id = q.id;
      const qEl = document.createElement('div'); qEl.className='pq-q'; qEl.textContent = (idx+1)+'. '+(q.question||'(未入力の設問)');
      card.appendChild(qEl);
      q.choices.forEach((ch, ci)=>{
        if(!ch) return;
        const label = document.createElement('label'); label.className='pq-choice';
        const radio = document.createElement('input'); radio.type='radio'; radio.name='run-'+q.id; radio.value=ci;
        const span = document.createElement('span'); span.textContent = ch;
        label.append(radio, span);
        card.appendChild(label);
      });
      const explain = document.createElement('div'); explain.className='pq-explain'; explain.textContent = q.explanation || '';
      card.appendChild(explain);
      runner.appendChild(card);
    });
    if(project.quiz.length===0){
      runner.innerHTML = '<div class="empty-side">この教材にはまだクイズが設定されていません。</div>';
      document.getElementById('gradeBtn').style.display = 'none';
    } else {
      document.getElementById('gradeBtn').style.display = 'inline-flex';
    }
  }

  document.getElementById('gradeBtn').addEventListener('click', ()=>{
    let correctCount = 0;
    project.quiz.forEach(q=>{
      const card = document.querySelector('.pq-card[data-id="'+q.id+'"]');
      const choices = card.querySelectorAll('.pq-choice');
      const checked = card.querySelector('input[type=radio]:checked');
      const chosen = checked ? parseInt(checked.value,10) : -1;
      const ok = chosen === q.correct;
      if(ok) correctCount++;
      choices.forEach((c,ci)=>{
        c.classList.remove('mark-correct','mark-incorrect');
        if(ci===q.correct) c.classList.add('mark-correct');
        else if(ci===chosen) c.classList.add('mark-incorrect');
      });
      card.classList.toggle('correct', ok);
      card.classList.toggle('incorrect', !ok);
      const explain = card.querySelector('.pq-explain');
      if(explain.textContent.trim()) explain.classList.add('show');
    });
    const total = project.quiz.length;
    const pct = total>0 ? Math.round((correctCount/total)*100) : 0;
    const area = document.getElementById('scoreArea');
    let cls = 'score-low', msg = 'もう一度動画を見直してみましょう。';
    if(pct>=80){ cls='score-good'; msg='しっかり理解できています。'; }
    else if(pct>=50){ cls='score-mid'; msg='あと少し。要点を振り返ってみましょう。'; }
    area.innerHTML = '<div class="score-banner '+cls+'"><div class="num">'+correctCount+' / '+total+'　正解</div><div class="msg">'+msg+'</div></div>';
    document.getElementById('gradeBtn').style.display = 'none';
    document.getElementById('retryQuizBtn').style.display = 'inline-flex';
    area.scrollIntoView({behavior:'smooth', block:'center'});
  });

  document.getElementById('retryQuizBtn').addEventListener('click', ()=>{
    document.getElementById('scoreArea').innerHTML = '';
    document.getElementById('retryQuizBtn').style.display = 'none';
    document.getElementById('gradeBtn').style.display = 'inline-flex';
    renderQuizRunner();
  });

  /* ===================== init ===================== */
  goList();
})();
</script>
</body>
</html>
